<meta name="claude:viewport-fit-sides" content="cover">
<title>마음의 평화를 찾아서</title>
<script>
/* 새 버전이 올라갔는데 브라우저가 예전 페이지를 쥐고 있으면 스스로 새로 불러온다 */
(function(){
  var BUILD='__BUILD__';
  function check(){
    try{
      fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(v){
        v=(v||'').trim();
        if(v&&v!==BUILD&&!/^__/.test(BUILD)&&location.search.indexOf('v='+v)<0) location.replace(location.pathname+'?v='+v);
      }).catch(function(){});
    }catch(e){}
  }
  check();
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 하얀 방 하나가 화면 전체. 캔버스가 바닥이고, 조작 막대는 위아래 가장자리에만 얹는다.
   한 가지 세계(하얀 방)를 일부러 고정한 디자인이라 밝은 테마 하나로 둔다. */
:root{
  --paper:#ffffff; --ink:#2f2e2a; --mute:#8c8a82; --line:#dcdad2;
  --pill:rgba(255,255,255,.82); --pill-edge:rgba(60,58,50,.16); --focus:#3d6f8f;
  --display:'Gowun Batang','Nanum Myeongjo','Apple SD Gothic Neo','Malgun Gothic',serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink); font:15px/1.5 var(--body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; position:relative;
}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1;outline:none}

/* 이름 입력 */
#login{word-break:keep-all;
  position:fixed;inset:0;z-index:40;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .9s ease;
}
#login.gone{opacity:0;pointer-events:none}
#login svg{width:200px;max-width:100%;height:auto;margin-bottom:4px}
#login h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,52px);letter-spacing:.06em;text-wrap:balance}
#login h1.brand{display:flex;align-items:baseline;justify-content:center;flex-wrap:nowrap;white-space:nowrap;gap:0;letter-spacing:0;line-height:1.05}
#login h1.brand .en{font-family:var(--display);font-weight:700;font-size:clamp(28px,7.6vw,52px);letter-spacing:.04em;padding:0 0 .06em;background:linear-gradient(100deg,#b9a57a 0%,#8a7a58 38%,#2f2e2a 72%);-webkit-background-clip:text;background-clip:text;color:transparent}
#login h1.brand .ko{font-size:clamp(28px,7.6vw,52px);letter-spacing:.04em;font-weight:700;color:#2f2e2a}
.lede{margin:0;max-width:30ch;color:#5d5b54;text-wrap:pretty}
#loginForm{display:flex;flex-direction:column;gap:8px;width:min(100%,320px);margin-top:10px;text-align:left}
#loginForm label{font-size:13px;color:var(--mute)}
#nick{font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#nick:focus-visible,.go:focus-visible,.pill:focus-visible,.plain:focus-visible,#vol:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.go{margin-top:6px;font-family:var(--display);font-size:19px;padding:12px;border:0;border-radius:10px;background:#2f2e2a;color:#fff;cursor:pointer}
.go:hover{background:#45433d}
.note{margin:6px 0 0;font-size:13px;color:var(--mute);max-width:34ch;text-wrap:pretty}

/* 장면 위 조작 막대 */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  transition:opacity 1.4s ease}
.bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;transition:opacity 1.4s ease}
.calm .fadey{opacity:.14}
.calm .fadey:hover,.calm .fadey:focus-within{opacity:1}
.pill,.chip,.pillbox{background:var(--pill);border:1px solid var(--pill-edge);border-radius:999px;color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill{pointer-events:auto;font:inherit;font-size:14px;padding:8px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.95)}
.sit{font-family:var(--display);font-weight:700;font-size:20px;padding:12px 22px;min-height:56px;min-width:132px}
[hidden]{display:none!important}
.timer{pointer-events:none;font-variant-numeric:tabular-nums;color:#55534c;display:flex;align-items:center;height:40px;padding-block:0}
.who{pointer-events:none;color:#55534c;display:flex;align-items:center;height:40px;padding-block:0}
.top{flex-wrap:wrap}
#hud.hubmode .place{order:3;flex-basis:100%}
.place .chip{min-width:0}
.place{flex:1;min-width:0;display:flex;justify-content:center;pointer-events:none}
.chip{border-radius:14px;padding:4px 14px;text-align:center;max-width:100%;line-height:1.3}
.chip b{display:block;font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{display:block;font-size:12px;color:#55534c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillbox{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:0 12px}
.plain{background:none;border:0;font:inherit;font-size:14px;color:inherit;cursor:pointer;padding:8px 0;min-height:40px;white-space:nowrap}
#vol{width:64px;accent-color:#2f2e2a}
.breath{margin:0;font-family:var(--display);font-size:20px;background:var(--pill);border-radius:999px;padding:6px 18px;opacity:0;transition:opacity .8s ease;min-height:38px}
.breath.on{opacity:1}
.yellbox{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:min(560px,94vw);padding:12px 14px;border-radius:22px;background:rgba(20,22,18,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.yellbox[hidden]{display:none}
.yellbox.actbox{gap:6px;padding:10px 12px}
.yellbox.actbox .yhead{display:flex;align-items:baseline;gap:10px;justify-content:center}
.yellbox.actbox .yq{font-size:20px}
.yellbox.actbox .ych{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100%;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.yellbox.actbox .ych::-webkit-scrollbar{display:none}
.yellbox.actbox .pill.ychip{font-size:15px;min-height:40px;padding:6px 14px;flex:none}
.yellbox.actbox .yrow{display:flex;gap:8px;width:100%;align-items:center}
.yellbox.actbox .yrow input{flex:1;min-width:0;min-height:44px;border-radius:999px;border:1px solid var(--pill-edge);padding:0 14px;font:inherit;font-size:16px;background:rgba(255,255,255,.9)}   /* 16px 미만이면 아이폰이 글자 칠 때 화면을 확대한다 */
.yellbox.actbox .pill.ygo{min-width:0;min-height:56px;font-size:21px;padding:10px 22px;flex:none}
.pill.act{min-width:min(300px,78vw);min-height:64px;font-size:23px;font-weight:700;border:none;border-radius:999px;color:#2a1d0c;background:linear-gradient(#fff1bd,#f5be52 52%,#e0952e);box-shadow:0 8px 0 #8f5614,0 14px 22px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.75)}
.pill.act:active{transform:translateY(6px);box-shadow:0 2px 0 #8f5614,0 6px 12px rgba(0,0,0,.3)}
#actRow[hidden]{display:none}
.yellbox .yhint{margin:0;font-size:14px;color:#f3e9d2;opacity:.9}
#punchPad{display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#punchPad[hidden]{display:none}
#punchPad .pbar{width:min(320px,80vw);height:10px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
#punchPad .pbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f5be52,#e0952e);transition:width .1s linear}
#punchPad .pstat{margin:0;font-size:20px;color:#3a2a14;background:rgba(255,255,255,.75);padding:2px 14px;border-radius:999px}
#punchPad .pstat b{font-size:28px}
#punchPad .pc{color:#d2601a;font-weight:700}
#punchPad .ppunch{width:150px;height:150px;border-radius:50%;border:none;font:inherit;font-size:44px;font-weight:700;color:#2a1d0c;background:radial-gradient(circle at 35% 30%,#fff3c4,#f5be52 55%,#d98a26);box-shadow:0 10px 0 #8f5614,0 18px 28px rgba(0,0,0,.35),inset 0 4px 0 rgba(255,255,255,.7);touch-action:manipulation}
#punchPad .ppunch:active{transform:translateY(7px);box-shadow:0 3px 0 #8f5614,0 8px 14px rgba(0,0,0,.3),inset 0 4px 0 rgba(255,255,255,.7)}
#punchPad .ppunch.bump{animation:pbump .12s}
@keyframes pbump{50%{transform:scale(.92) translateY(5px)}}
#punchPad .ppunch[hidden]{display:none}
#punchPad .presult{margin:0;font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.yellbox .ycount{margin:-4px 0 0;color:#ffe9a8;font-size:15px}
.yellbox .ycount[hidden]{display:none}
.yellbox .yq{margin:0;color:#fffbe8;font-family:var(--display);font-weight:700;font-size:22px}
.yellbox .ych{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.yellbox .ych[hidden],.yellbox .yme[hidden],.yellbox .ygo[hidden]{display:none}
.yellbox .pill.ychip{font-size:16px;min-height:48px;padding:8px 16px;border-radius:999px;border:none;background:linear-gradient(#fffdf4,#efe6cc);color:#3a2a14;box-shadow:0 5px 0 #b9a77c,0 8px 14px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.9);transition:transform .08s,box-shadow .08s}
.yellbox .pill.ychip:active{transform:translateY(4px);box-shadow:0 1px 0 #b9a77c,0 3px 6px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.9)}
.yellbox .pill.ychip.on{background:linear-gradient(#fff1bd,#f5c862);box-shadow:0 5px 0 #a8701e,0 8px 14px rgba(0,0,0,.25),inset 0 0 0 3px #e0952e,inset 0 2px 0 rgba(255,255,255,.9)}
.yellbox .pill.ygo{min-width:min(340px,80vw);min-height:72px;font-size:26px;font-weight:700;padding:14px 44px;border:none;border-radius:999px;color:#2a1d0c;background:linear-gradient(#fff1bd,#f5be52 52%,#e0952e);box-shadow:0 9px 0 #8f5614,0 16px 26px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(120,60,0,.25);text-shadow:0 1px 0 rgba(255,255,255,.5);transition:transform .08s,box-shadow .08s}
.yellbox .pill.ygo:active{transform:translateY(7px);box-shadow:0 2px 0 #8f5614,0 6px 12px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.75)}
.yellbox .pill.ychip:hover,.yellbox .pill.ygo:hover{filter:brightness(1.04)}
.yellbox .yme{display:flex;gap:6px;width:100%;justify-content:center}
.yellbox .yme input{flex:1;max-width:260px;min-height:40px;border-radius:999px;border:1px solid var(--pill-edge);padding:0 14px;font:inherit;font-size:16px;background:rgba(255,255,255,.9)}
.hubhint{margin:0;font-size:13px;color:#6f6d65;text-align:center;background:rgba(255,255,255,.75);padding:4px 14px;border-radius:999px}

#veil{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .75s ease}

.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden}
.sr button:focus-visible{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;width:auto;height:auto}

@media (prefers-reduced-motion:reduce){
  #veil,#login,.top,.row,.breath{transition-duration:.01s}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<canvas id="stage" aria-label="3D 명상 공간. 문을 눌러 들어가고, 바닥을 눌러 걸어가세요. 화면을 끌면 시점이 돌아가요."></canvas>

<section id="login">
  <svg viewBox="0 0 310 52" role="img" aria-label="하얀 문 넷, 검은 문 넷">
    <path d="M6 48V24a14 14 0 0 1 28 0v24" fill="none" stroke="#cfcdc4" stroke-width="1.5"/>
    <line x1="6" x2="34" y1="48" y2="48" stroke="#4f9cc7" stroke-width="2.5" stroke-linecap="round"/>

    <line x1="158" x2="186" y1="48" y2="48" stroke="#d4b04a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M196 48V24a14 14 0 0 1 28 0v24z" fill="#26241f" stroke="#26241f" stroke-width="1.5"/>
    <line x1="196" x2="224" y1="48" y2="48" stroke="#d4b04a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M234 48V24a14 14 0 0 1 28 0v24z" fill="#26241f" stroke="#26241f" stroke-width="1.5"/>
    <line x1="234" x2="262" y1="48" y2="48" stroke="#d4b04a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M272 48V24a14 14 0 0 1 28 0v24z" fill="#26241f" stroke="#26241f" stroke-width="1.5"/>
    <line x1="272" x2="300" y1="48" y2="48" stroke="#d4b04a" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <h1 class="brand" aria-label="마음의 평화를 찾아서"><span class="en">마음의 평화</span><span class="ko">를 찾아서</span></h1>
  <p class="lede">고요히 다스리거나, 시원하게 터뜨리거나.<br>하얀 공간과 검은 공간에서 마음 가는 문을 열어 보세요.</p>
  <form id="loginForm" autocomplete="off">
    <label for="nick">이름</label>
    <input id="nick" maxlength="12" placeholder="불리고 싶은 이름" autocomplete="nickname">
    <button class="go" type="submit">들어가기</button>
  </form>
  <p class="note">초대받아 로그인한 사람들끼리는 같은 문 안에서 서로 보여요. 소리가 나니 이어폰을 권해요.</p>
</section>

<div id="hud" hidden>
  <div class="top fadey">
    <button id="backBtn" class="pill" type="button">‹ 하얀 방</button>
    <div id="who" class="pill who"></div>
    <div id="together" class="pill who" hidden></div>
    <div class="place"><div class="chip"><b id="placeName"></b><small id="placeHint"></small></div></div>
    <div class="pillbox">
      <button id="muteBtn" class="plain" type="button" aria-pressed="false">소리 켬</button>
      <input id="vol" type="range" min="0" max="100" value="70" aria-label="소리 크기">
    </div>
  </div>
  <div class="bottom">
    <p id="hubHint" class="hubhint">바닥을 누르면 걸어가고, 문을 누르면 들어가요. 화면을 끌면 시점이 돌아가요.</p>
    <p id="breathText" class="breath" aria-hidden="true"></p>
    <div id="sitRow" class="row fadey">
      <button id="breathBtn" class="pill" type="button" aria-pressed="true">호흡 안내 켬</button>
      <button id="sitBtn" class="pill sit" type="button">여기 앉기</button>
      <button id="lieBtn" class="pill sit" type="button">눕기</button>
      <div id="timer" class="pill timer">앉은 시간 00:00</div>
    </div>
    <div id="actRow" class="row" hidden>
      <button id="actBtn" class="pill sit act" type="button">소리 지르기</button>
    </div>
  </div>
</div>
