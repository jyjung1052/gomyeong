name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI: 조각 합치기 → 문법 검사 → 동작 시뮬레이션
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: ./scripts/build.sh
      - name: Smoke test (7개 장면, 눕기, 접속 신호)
        run: node src/stub.js | tail -3
      - name: 서로 보이기 · 중계 서버 검사 시험
        run: node test/relay.test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # CD: main 에 올라가면 GitHub Pages 로 자동 배포
  deploy:
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # CD: Cloudflare Pages(innerpeace.pages.dev)에도 자동 배포. 프로젝트가 없으면 처음 한 번 만든다
  deploy-cloudflare:
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: ./scripts/build.sh
      - name: 시크릿이 없으면 건너뜀
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN 이 없어 Cloudflare Pages 배포를 건너뜁니다."
      - name: Deploy to Cloudflare Pages
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          report(){ tail -n 15 "$1" | tr -d '\r' | sed 's/\x1b\[[0-9;]*m//g' | awk 'NF' | while IFS= read -r l; do echo "::$2::$l"; done; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID   # 비어 있으면 토큰에서 계정을 찾게 둔다
          npx --yes wrangler@3 pages project create innerpeace --production-branch=main > create.log 2>&1 || { report create.log warning; }
          if npx --yes wrangler@3 pages deploy dist --project-name=innerpeace --branch=main --commit-dirty=true > deploy.log 2>&1; then report deploy.log notice; else report deploy.log error; exit 1; fi
